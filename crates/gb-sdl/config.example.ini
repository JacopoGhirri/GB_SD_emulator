# gb-sdl settings. Every line below is the built-in default, commented out.
# Remove the leading "# " from a line to change it. Command-line flags override this file.
# Lines start with # or ; for comments. A mistake (unknown name, bad number) stops the
# program with a message naming the line, so check the terminal / log if it will not start.

# ---- Window and picture ------------------------------------------------------------
# scale = 4                  # initial window scale, 1 to 20
# fullscreen = false
# palette = grey             # DMG colours: grey, green, pocket, mint (F9 cycles in game)

# ---- Sound and speed ---------------------------------------------------------------
# volume = 1.0               # 0.0 to 1.0 (+ and - change it in game)
# slow_mo_speed = 0.25       # while slow motion is held: 0.1 to 1 times normal

# ---- Gamepad ---------------------------------------------------------------------------
# swap_ab = false            # true = Nintendo layout (Deck B/east = GB A, Deck A/south = GB B)

# ---- Keyboard bindings (comma-separated SDL key names; a line replaces the defaults) --
# key.right = Right
# key.left = Left
# key.up = Up
# key.down = Down
# key.a = X
# key.b = Z
# key.start = Return
# key.select = Backspace, Right Shift
# key.quit = Escape
# key.fullscreen = F11
# key.slow_mo = S
# key.pause = P
# key.reset = F10
# key.screenshot = F12
# key.save_state = F5
# key.load_state = F8
# key.next_slot = F6
# key.next_palette = F9

# ---- Gamepad bindings (SDL names: a b x y back start leftshoulder rightshoulder dpup
# ---- dpdown dpleft dpright leftstick rightstick) ---------------
# pad.right = dpright
# pad.left = dpleft
# pad.up = dpup
# pad.down = dpdown
# pad.a = a
# pad.b = b
