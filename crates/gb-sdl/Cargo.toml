[package]
name = "gb-sdl"
description = "Desktop / Steam Deck frontend (SDL2 video, keyboard and gamepad input, battery saves)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gb-core = { path = "../gb-core" }
# sdl2: window, texture, keyboard and GameController input (CLAUDE.md section 2 names it for this crate).
# System libsdl2 is linked (no `bundled`).
sdl2 = "0.37"
