[workspace]
resolver = "2"
members = [
    "crates/gb-core",
    "crates/gb-cli",
    "crates/gb-sdl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
# Emulator inner loops benefit from inlining across crates.
codegen-units = 1

[profile.test]
# ROM tests and Doctor trace diffs execute tens of millions of instructions; unoptimised
# builds make `cargo test` take minutes.
opt-level = 3
